name: Build & Deploy Book

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Render Quarto & Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: release

      - name: Render Quarto Book
        run: |
          quarto render --to html

      - name: Configure SSH Private Key & Host Verification
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H -p "$SERVER_PORT" "$SERVER_HOST" >> ~/.ssh/known_hosts || true
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via Rsync over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT || 22 }}
        run: |
          echo "Deploying rendered book to /var/www/iland-model.org/html/iland-book/..."
          
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -p ${SERVER_PORT} \
            ${SERVER_USER}@${SERVER_HOST} "mkdir -p /var/www/iland-model.org/html/iland-book"

          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new -p ${SERVER_PORT}" \
            _book/ \
            ${SERVER_USER}@${SERVER_HOST}:/var/www/iland-model.org/html/iland-book/
